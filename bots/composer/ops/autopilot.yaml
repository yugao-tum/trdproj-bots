# composer 自主循环配置（可调；3h 复盘时优先改这里）
version: 1

schedule:
  # Cloud Agent：15m 赶进度（主引擎）；整点简报；3h 复盘
  sprint_cron: "*/15 * * * *"
  hourly_brief_cron: "0 * * * *"
  retro_every_hours: 3
  retro_cron: "0 */3 * * *"
  # VM tmux：与 15m 同频轻采集（不唤醒 Agent）
  watchdog_interval_seconds: 900

concurrency:
  max_workers: 4
  tasks:
    portwatch_fetch: true
    hormuz_replay: true
    entry_lint: true
    gamma_probe: true

limits:
  max_pending_review_per_round: 15
  max_new_mechanism_slots_per_round: 3  # GUIDE §2.1 slot: 新机制
  round2_rules_effective_utc: "2026-10-21T00:00:00Z"  # NOTICES 提速：R2 条文与滚动核对
  round2_start_utc: "2026-10-26T00:00:00Z"  # 排行榜轮次周界
  round1_end_utc: "2026-10-25T23:59:59Z"
  rolling_review_hours: 48  # evidence 含回放/前向且 8 字段齐全
  target_pm_entries_round1: 10
  min_hormuz_closed_events: 26
  sprint_chat_policy: "仅 P0 完成或整点 hourly 对用户发言"

startup_read:
  - NOTICES.md
  - NEEDS.md
  - ops/RULES_DIGEST.md

paths:
  cache_dir: notes/cache
  blockers: ops/BLOCKERS.md
  briefings: reports/BRIEFINGS.md
  retrospectives: reports/RETROSPECTIVES.md

push:
  repo: yugao-tum/trdproj-bots
  branch: main
  # 推送由 Cloud Agent 通过 GitHub MCP 执行；脚本只生成 /tmp/composer-push-*.json
