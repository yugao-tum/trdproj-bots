# composer 自主循环配置（可调；3h 复盘时优先改这里）
version: 1

schedule:
  # Cloud Agent：15m 赶进度（主引擎）；整点简报；3h 复盘
  sprint_cron: "*/15 * * * *"
  hourly_brief_cron: "0 * * * *"
  retro_every_hours: 3
  retro_cron: "0 */3 * * *"
  # VM tmux：与 15m 同频轻采集（不唤醒 Agent）
  watchdog_interval_seconds: 900

concurrency:
  max_workers: 4
  tasks:
    portwatch_fetch: true
    hormuz_replay: true
    entry_lint: true
    gamma_probe: true

limits:
  max_pending_review_per_round: 15
  max_new_mechanism_slots_per_round: 3  # GUIDE §2.1 slot: 新机制
  round2_rules_effective_utc: "2026-10-21T00:00:00Z"  # 已被 10-22 公告取消，保留原值供对照
  round2_start_utc: "2026-10-26T00:00:00Z"  # 第 2 轮不再进行
  round1_end_utc: "2026-10-22T10:00:00Z"  # NOTICES 10-22：截止，之后的推送不算
  contest_results_utc: "2026-10-22T16:00:00Z"  # 此前公布 SCOREBOARD
  rolling_review_hours: 48  # 滚动核对随第 2 轮取消；带实测的回放仍当证据
  target_pm_entries_round1: 10
  min_hormuz_closed_events: 26
  sprint_chat_policy: "仅 P0 完成或整点 hourly 对用户发言"

priorities:
  # NOTICES 2026-10-22：10:00 UTC 截止，16:00 UTC 前公布。第 2 轮取消，011 不计分。
  # quant-035 已在条目里标待核（d2e4244，改进 composer-003）。不跟，不重开 003。
  # 10:00 UTC 之前：T04watch 仍先检查；无 10-19 日则 011 照旧记挂单（整点 +6，非整点只 scan），不改 0.011/0.989。
  # 10:00 UTC 之后：停 15m / hourly / retro。不再读 010 的 RCP。不新开待核。
  t04watch_blocked_sprint: composer-011-daily
  open_p0_before_blocked_watch: true

competitor_watch:
  bots: [dot, quant, muse]
  hourly: delta_vs_snapshot  # 整点简报必写对手一句
  retro: append_COMPETITOR_SNAPSHOT  # 3h 全量追加一节（T20）

startup_read:
  - NOTICES.md
  - NEEDS.md
  - ops/RULES_DIGEST.md
  - notes/COMPETITOR_SNAPSHOT.md

paths:
  cache_dir: notes/cache
  blockers: ops/BLOCKERS.md
  briefings: reports/BRIEFINGS.md
  retrospectives: reports/RETROSPECTIVES.md

push:
  repo: yugao-tum/trdproj-bots
  branch: main
  # 推送由 Cloud Agent 通过 GitHub MCP 执行；脚本只生成 /tmp/composer-push-*.json
